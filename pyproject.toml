[project]
name = "pyforce-rosie"
version = "2.0.0-beta0"
description = "Modular robot control system"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Rolando Urquiza" },
    { name = "Fernando Martínez González" },
    { name = "Gustavo Viera-López" },
    { name = "Antonio Serrano Muñoz" },
    { name = "Danilo Gómez Gómez" },
    { name = "Alex Coto" },
    { name = "Silvio Delgado" },
    { name = "Jesús Garnica" },
]
maintainers = [
    { name = "Gustavo Viera-López", email = "gvieralopez@gmail.com" },
]
license = { text = "MIT" }
keywords = ["robotics", "mobile robots", "differential drive", "path planning"]

dependencies = [
    "fastapi>=0.162",
    "numpy>=2.5",
    "pydantic>=2.14",
    "shapely>=2.2",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
# the boards of real robots: Arduino (serial) and MD25 or the ultrasound board (I2C)
hardware = ["pyserial>=3.5", "smbus2>=0.6"]

[project.urls]
Repository = "https://github.com/PyForce/rosie"
Issues = "https://github.com/PyForce/rosie/issues"

[project.scripts]
rosie = "rosie.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-env>=1.8",
    "ruff>=0.17",
    "ebump>=0.2.2",
    "types-shapely>=2.1",
]

docs = ["zensical>=0.0.72", "mkdocstrings[python]>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosie"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = [".cookie-pyrate"]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins: Check variables shadowing
    "ARG",    # flake8-unusedarguments
    "B",      # flake8-bugbear: Finds likely bugs and design problems
    "C901",   # Mccabe complexity checker
    "ERA",    # Erradicate
    "E4",     # Pycodestyle: Line length, indentation, etc.
    "E7",     # Pycodestyle: Miscellaneous checks
    "E9",     # Pycodestyle: Syntax errors
    "F",      # Pyflakes: Unused imports, undefined variables, etc.
    "FIX",    # Avoid lines containing TODO tags
    "G",      # flake8-logging-format: Ensure logging messages follow best practices.
    "I",      # Isort: Import sorting
    "LOG",    # flake8-logging: Use the logging module correctly
    "N",      # pep8-naming: Enforce naming conventions
    "PGH004", # Enforce specify the rule to avoid on noqa tags
    "PL",     # Pylint
    "PTH",    # flake8-use-pathlib: Enforces pathlib usage
    "RUF",    # Ruff-specific rules: Mostly for handling noqa tags and general stuff
    "S",      # flake8-bandit: Identifies common security issues in code
    "SIM",    # flake8-simplify
    "T20",    # flake8-print: Avoids print in the code
    "UP",     # Pyupgrade
    "W",      # Pycodestyle warnings
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S101", "PLR2004", "PLR0913"]
"scripts/**" = ["T20", "S603"]  # Allow print statements and subprocess calls on the scripts

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true


[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
extra_checks = true


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-fail-under=80"
python_files = "tests.py test_*.py *_test.py"
pythonpath = "./src"
env_files = [".env.test"]


[tool.ebump.patterns]
"src/rosie/__init__.py" = ['^__version__ = "{version}"$']
