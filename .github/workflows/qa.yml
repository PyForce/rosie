name: QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    uses: gvieralopez/cookie-pyrate/.github/workflows/reusable-qa.yml@v1.1.0
    with:
      cookie-pyrate-ref: v1.1.0
      python-version: "3.15"
      # the client runs on users' own Pythons; the robot's image uses 3.15
      test-python-versions: '["3.12", "3.13", "3.14", "3.15"]'
