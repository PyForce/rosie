[project]
site_name = "rosie"
site_description = "Mobile robot control in plain Python, for learning and teaching robotics"
site_dir = "dist/docs"
nav = [
  { "🏠 Home" = "index.md" },
  { "🚀 Getting started" = "getting-started.md" },
  { "Learn" = [
    { "How rosie works" = "how-rosie-works.md" },
    { "Motion control" = "motion-control.md" },
    { "Navigation" = "navigation.md" },
    { "Teaching with rosie" = "teaching.md" },
  ] },
  { "Use" = [
    { "Robots and hardware" = "robots.md" },
    { "Web API and extensions" = "integration.md" },
    { "Python client" = "client.md" },
  ] },
  { "📖 Reference" = "reference.md" },
  { "ℹ️ About" = "about.md" },
]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_if_no_docstring = true
show_submodules = true
merge_init_into_class = true
filters = ["!^_", "!^logger$"]

[project.theme]
name = "material"
language = "en"
logo = "images/logo.svg"
favicon = "images/logo.svg"
features = [
  "navigation.sections", # Separates sections within the navigation
  "navigation.top", # Moves the navigation to the top bar
]

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "blue"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.codehilite]
guess_lang = false
linenums = true

[project.markdown_extensions.pymdownx.superfences] # Enhances fenced code blocks

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.toc]
permalink = true
