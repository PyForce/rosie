# Read the Docs builds the documentation with Zensical, from the locked docs group.
version: 2

build:
  os: ubuntu-26.04
  tools:
    # Read the Docs may not offer the project's Python yet; uv installs it from .python-version.
    python: "latest"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --no-default-groups --group docs
    build:
      html:
        - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv run --no-sync zensical build --clean
    post_build:
      - mkdir -p "${READTHEDOCS_OUTPUT}/html"
      - cp -r dist/docs/. "${READTHEDOCS_OUTPUT}/html/"
